worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect www to non-www (canonical host)
    server {
        listen 80;
        server_name www.lensisku.lojban.org;
        return 301 http://lensisku.lojban.org$request_uri;
    }

    server {
        listen 80;
        server_name lensisku.lojban.org;

        # Frontend static files
        root /src/frontend/dist;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Locale root paths
        location = /en/ {
            try_files /en.html =404;
        }

        location = /jbo/ {
            try_files /jbo.html =404;
        }

        location = /ru/ {
            try_files /ru.html =404;
        }

        location = /ja/ {
            try_files /ja.html =404;
        }

        location = /zh/ {
            try_files /zh.html =404;
        }

        # Redirect root to default locale with 302 (temporary, respects user preference via client-side)
        location = / {
            return 302 /en;
        }

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI
        location /swagger {
            proxy_pass http://127.0.0.1:8080/swagger;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location ~* \.js$ {
            types { } default_type "application/javascript";
        }
    }
}
